ban.admin_page:
  path: '/admin/config/people/ban/{default_ip}'
  defaults:
    _form: '\Drupal\ban\Form\BanAdmin'
    _title: 'IP address bans'
    default_ip: ''
  requirements:
    _permission: 'ban IP addresses'

ban.delete:
  path: '/admin/config/people/ban/delete/{ban_id}'
  defaults:
    _form: '\Drupal\ban\Form\BanDelete'
    _title: 'Delete IP address'
  requirements:
    _permission: 'ban IP addresses'

ban.delete.multiple:
  path: '/admin/config/people/ban/delete/multiple'
  defaults:
    _form: '\Drupal\ban\Form\BanDeleteMultiple'
    _title: 'Delete multiple IP addresses'
  requirements:
    _permission: 'ban IP addresses'
