# Schema for configuration files of the Field module.

field.settings:
  type: config_object
  label: 'Field settings'
  constraints:
    FullyValidatable: ~
  mapping:
    purge_batch_size:
      type: integer
      label: 'Maximum number of field data records to purge'
      constraints:
        NotNull: []
        Range:
          min: 1

field.storage.*.*:
  type: config_entity
  label: 'Field'
  constraints:
    FullyValidatable: ~
    UniqueFieldCombination: [entity_type, field_name]
  mapping:
    id:
      type: string
      label: 'ID'
      constraints:
        StringParts:
          separator: .
          parts:
            - '%parent.entity_type'
            - '%parent.field_name'
    field_name:
      type: string
      label: 'Field name'

      constraints:
        NotBlank: {}
        Length:
          # @see \Drupal\field\Entity\FieldStorageConfig::NAME_MAX_LENGTH
          max: 32
    entity_type:
      type: string
      label: 'Entity type'
      constraints:
        PluginExists:
          manager: entity_type.manager
          interface: '\Drupal\Core\Entity\FieldableEntityInterface'
    type:
      type: string
      label: 'Type'
      constraints:
        # @todo In principle, we should validate that this plugin was indeed provided by `module`.
        PluginExists:
          manager: plugin.manager.field.field_type
          interface: '\Drupal\Core\Field\FieldItemInterface'
    settings:
      type: field.storage_settings.[%parent.type]
    module:
      type: string
      label: 'Module'
      constraints:
        ExtensionExists: 'module'
    locked:
      type: boolean
      label: 'Locked'
    cardinality:
      type: integer
      label: 'Maximum number of values users can enter'
      constraints: {}
      # @todo Create this constraint.
      # NoEntitiesExistYetWithHigherCardinality: []
    translatable:
      type: boolean
      label: 'Translatable'
    indexes:
      type: sequence
      label: 'Indexes'
      # @todo Constraints — but shockingly this A) uses `type: ignore`, B) has zero validation logic in core?!
      sequence:
        type: sequence
        label: 'Indexes'
        sequence:
          type: ignore
          label: 'Index'
    persist_with_no_fields:
      type: boolean
      label: 'Persist field storage with no fields'
    custom_storage:
      type: boolean
      label: 'Enable custom storage'

field.field.*.*.*:
  type: field_config_base
  label: 'Field'
  mapping:
    # Extend `field_config_base:field_type` with a FieldConfig entity-specific
    # constraint. (This does not apply to BaseFieldOverride entities.)
    field_type:
      constraints:
        MatchesOtherConfigValue:
          # This field_storage_config entity must exist. This is already guaranteed.
          # @see \Drupal\field\Entity\FieldConfig
          # @see \Drupal\Core\Config\Plugin\Validation\Constraint\RequiredConfigDependenciesConstraint
          prefix: field.storage.
          id: ['%parent.entity_type', '%parent.field_name']
          propertyPath: type
  constraints:
    FullyValidatable: ~
