core.extension:
  type: config_object
  label: 'Extension settings'
  constraints:
    FullyValidatable: ~
  mapping:
    module:
      type: sequence
      label: 'Enabled modules'
      # @todo Figure out a way to allow validating the SEQUENCE KEYS, ideally this would allow reusing the `ExtensionName: []` and `ExtensionExists: module`
      constraints: {}
      sequence:
        type: weight
        label: 'Weight'
    theme:
      type: sequence
      label: 'Installed themes'
      # @todo Figure out a way to allow validating the SEQUENCE KEYS, ideally this would allow reusing the `ExtensionName: []` and `ExtensionExists: theme`
      constraints: {}
      sequence:
        type: weight
        label: 'Weight'
    profile:
      type: string
      # Before Drupal is installed the profile is NULL. This allows all install
      # profiles to be discovered by the installer.
      nullable: true
      # After Drupal is installed, if the install profile is uninstalled the key
      # will be removed.
      requiredKey: false
      label: 'Install profile'
      constraints:
        NotBlank: []
        ExtensionName: []
        ExtensionExists: profile
